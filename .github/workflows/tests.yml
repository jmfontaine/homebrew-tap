# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
    paths:
      - Formula/**
      - .github/workflows/**
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  # Pull requests always run this workflow so the required `tests` check reports; test-bot
  # only runs when they touch formulae or workflows.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      test-bot: ${{ steps.filter.outputs.test-bot }}
    steps:
      - name: Check for formula or workflow changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]
          then
            echo "test-bot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include the old path of renamed files so moving a formula out of Formula/ still runs test-bot.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          if grep -qE '^(Formula/|\.github/workflows/)' <<< "$files"
          then
            echo "test-bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "test-bot=false" >> "$GITHUB_OUTPUT"
          fi

  test-bot:
    needs: changes
    if: needs.changes.outputs.test-bot == 'true'
    strategy:
      matrix:
        os: [ macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  # The required status check. A skipped matrix job reports under its unexpanded name, so
  # requiring `test-bot (macos-26)` would leave PRs that skip it waiting forever.
  tests:
    needs: [ changes, test-bot ]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_BOT_RESULT: ${{ needs.test-bot.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$TEST_BOT_RESULT" == success || "$TEST_BOT_RESULT" == skipped ]]
